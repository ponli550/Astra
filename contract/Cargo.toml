[package]
name = "z-tenant-consent"
version = "0.4.1"
edition = "2021"
description = "Auditable-consent data vault for T3N z-space tenants"
license = "MIT"
publish = false

# cdylib makes the wasm32-wasip2 target emit a WASM *component*.
# lib keeps the business logic unit-testable on the native target.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

# Keeps the artifact small — registration has a size cap.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
