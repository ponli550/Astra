# Minimal tmux config for the recording. Loaded with -f so the recording
# never depends on the operator's own tmux setup: a rebound prefix or a
# themed status line would change what the keystrokes do and what the
# frames look like.
set -g prefix C-b
bind-key o select-pane -t :.+
set -g status off
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour109
set -g mouse off
set -sg escape-time 0
